<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b5cff"></stop>

      <stop offset="50%" stop-color="#ff4fd8"></stop>

      <stop offset="100%" stop-color="#42b8ff"></stop>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"></feGaussianBlur>

      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

  </defs>

  <rect width="512" height="512" rx="120" fill="#09090d"></rect>

  <circle cx="256" cy="256" r="160" fill="url(#bg)" opacity=".22" filter="url(#shadow)"></circle>

  <rect x="126" y="126" width="260" height="260" rx="72" fill="url(#bg)"></rect>

  <path d="
      M185 285
      L235 235
      L270 270
      L335 195
    " fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"></path>

  <circle cx="335" cy="195" r="17" fill="white"></circle>

</svg>